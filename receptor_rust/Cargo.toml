[package]
name = "receptor_aegis"
version = "1.0.0"
edition = "2021"
description = "Estación terrena AEGIS en Rust: recibe por WebSocket la telemetría cifrada de la nave, corrige el ruido del canal, verifica, descifra, filtra picos y genera informes."
license = "MIT"

[[bin]]
name = "receptor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1"
flate2 = "1"
getrandom = "0.2"
enable-ansi-support = "0.2"

[profile.release]
opt-level = 3
